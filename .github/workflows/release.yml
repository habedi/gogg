name: Make Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build-windows:
    name: Build Windows binary
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup MSYS2 environment
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            mingw-w64-x86_64-go
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-freeglut

      - name: Run tests
        shell: msys2 {0}
        run: |
          make test

      - name: Build Windows binary
        shell: msys2 {0}
        run: |
          make release GOGG_BINARY=gogg.exe

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: gogg-windows-amd64
          path: bin/gogg.exe

  build-linux:
    name: Build Linux binary
    runs-on: ubuntu-latest
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          make install-deps

      - name: Run tests
        run: |
          make test

      - name: Build Linux binary
        run: |
          make release

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: gogg-linux-amd64
          path: bin/gogg

  build-macos:
    name: Build macOS binary
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install dependencies
        run: |
          brew install make pkg-config glfw

      - name: Run tests
        run: |
          make test

      - name: Build macOS binary
        run: |
          make release-macos

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: gogg-macos-arm64
          path: bin/gogg

  build-linux-arm64:
    name: Build Linux binary (ARM64)
    runs-on: ubuntu-24.04-arm
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          make install-deps

      - name: Run tests
        run: |
          make test

      - name: Build Linux ARM64 binary
        run: |
          make release

      - name: Upload Linux ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: gogg-linux-arm64
          path: bin/gogg

  build-windows-arm64:
    name: Build Windows binary (ARM64)
    runs-on: windows-11-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup MSYS2 environment
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          install: >-
            make
            mingw-w64-clang-aarch64-go
            mingw-w64-clang-aarch64-gcc
            mingw-w64-clang-aarch64-pkg-config
            mingw-w64-clang-aarch64-freeglut

      - name: Run tests
        shell: msys2 {0}
        run: |
          make test

      - name: Build Windows ARM64 binary
        shell: msys2 {0}
        run: |
          make release GOGG_BINARY=gogg.exe

      - name: Upload Windows ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: gogg-windows-arm64
          path: bin/gogg.exe

  build-and-push-docker:
    runs-on: ubuntu-latest
    needs: [ build-linux ]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags and labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=ref,event=branch
            type=ref,event=tag

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    runs-on: ubuntu-latest
    needs: [ build-windows, build-linux, build-macos, build-linux-arm64, build-windows-arm64 ]
    permissions:
      contents: write
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: gogg-windows-amd64
          path: ./dist/windows

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: gogg-linux-amd64
          path: ./dist/linux

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: gogg-macos-arm64
          path: ./dist/macos

      - name: Download Linux ARM64 artifact
        uses: actions/download-artifact@v4
        with:
          name: gogg-linux-arm64
          path: ./dist/linux-arm64

      - name: Download Windows ARM64 artifact
        uses: actions/download-artifact@v4
        with:
          name: gogg-windows-arm64
          path: ./dist/windows-arm64

      - name: List downloaded files (for debugging)
        run: ls -R ./dist

      - name: Create archives for each platform
        run: |
          cd dist/windows && zip -r9 ../gogg-windows-amd64.zip gogg.exe && cd ../..
          cd dist/linux && zip -r9 ../gogg-linux-amd64.zip gogg && cd ../..
          cd dist/macos && zip -r9 ../gogg-macos-arm64.zip gogg && cd ../..
          cd dist/linux-arm64 && zip -r9 ../gogg-linux-arm64.zip gogg && cd ../..
          cd dist/windows-arm64 && zip -r9 ../gogg-windows-arm64.zip gogg.exe && cd ../..

      - name: List archives (for debugging)
        run: ls -l dist/gogg-*.zip

      # A tag push (v*) names the draft after the tag; a manual run names it
      # draft-<run id>, so the workflow can be exercised without cutting a
      # real tag. The release is always a draft, left for a maintainer to
      # review and publish.
      - name: Set release tag
        id: release_tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "release_tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "release_tag=draft-${{ github.run_id }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release draft
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: ${{ steps.release_tag.outputs.release_tag }}
          tag: ${{ steps.release_tag.outputs.release_tag }}
          # The draft points at the commit the workflow ran on; the git tag
          # itself is created only when the draft is published.
          commit: ${{ github.sha }}
          draft: true
          prerelease: false
          allowUpdates: true
          body: |
            Draft release ${{ steps.release_tag.outputs.release_tag }}.

            Desktop binaries for Linux, macOS, and Windows (amd64 and arm64) are attached.
            The same release is also published as a container image to GHCR:

            ```bash
            docker pull ghcr.io/${{ github.repository }}:latest
            ```
          artifacts: |
            dist/gogg-windows-amd64.zip
            dist/gogg-windows-arm64.zip
            dist/gogg-linux-amd64.zip
            dist/gogg-linux-arm64.zip
            dist/gogg-macos-arm64.zip
